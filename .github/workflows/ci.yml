name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install black ruff

      - name: Check formatting (black)
        run: black --check --line-length 100 freewhisper.py

      - name: Lint (ruff)
        run: ruff check freewhisper.py

  syntax:
    name: Syntax check
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile-check the source
        # We don't install heavy deps (mlx requires Apple Silicon, GH runners are x86_64).
        # This just catches syntax errors and trivial import-order mistakes.
        run: python -m py_compile freewhisper.py
